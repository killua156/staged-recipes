# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.2"

package:
  name: pksuid
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pksuid/pksuid-${{ version }}.tar.gz
  sha256: dc08ed7924a8affea5f36af4b6af345b126f521c9165b95e91ca1a2acef99e49
  patches:
    # Upstream pins pybase62 ==0.4.3 (a poetry exact pin), which no version of
    # pybase62 on conda-forge satisfies, so pip check fails without this. The
    # pin is not protecting an API break: pybase62 1.0.0 keeps encodebytes and
    # decodebytes, and only prepends a padding prefix when the input has
    # leading zero bytes. A pksuid uid is a 4 byte offset from the 2014 epoch,
    # so that only happens for timestamps before Nov 2014, where 0.4.3 was
    # already broken (it dropped the leading zero and parse raised on the short
    # uid). Every ID from 2015 onward encodes byte for byte identically under
    # both, so IDs stay interchangeable with pip installed pksuid. run_test.py
    # locks that in by re-encoding a reference ID generated with 0.4.3.
    # Upstream last released in May 2022 and has no open issues or PRs, so do
    # not expect this to be fixed upstream; drop the patch if it ever is.
    - patches/0001-loosen-pybase62-pin.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core >=1.0.0
    - pip
  run:
    - python >=${{ python_min }}
    - pybase62 >=0.4.3

tests:
  - python:
      imports:
        - pksuid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  # Upstream excludes its test suite from the sdist, so this covers the same
  # ground: generation, parse round trip, the reference ID format check that
  # backs the pybase62 patch, timestamps, ordering and the error paths.
  - script: python run_test.py
    files:
      recipe:
        - run_test.py
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://github.com/sashahilton00/python-pksuid
  license: MIT
  license_file: LICENSE.txt
  summary: Python package for generating prefixed ksuids.
  repository: https://github.com/sashahilton00/python-pksuid
  description: |
    Python-PKSUID (Prefixed K-Sortable Unique IDentifier).

    This library extends the KSUID identifier (first proposed and used by
    Segment.io) with a prefix, inspired by Stripe-style prefixed IDs such as
    `txn_1032HU2eZvKYlo2CEPtcnUvl`. The prefix makes it easy to see at a
    glance the underlying type of the resource an identifier refers to, and
    makes for easier reading and tracing of resources in log files and other
    locations.

extra:
  recipe-maintainers:
    - rxm7706
